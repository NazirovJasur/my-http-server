{{template "header" .}}

<h2>Добавить трату</h2>

<form method="POST" action="/add">
    <p><label>Сумма:<br><input type="number" step="0.01" min="0.01" name="amount" required></label></p>
    <p><label>Описание:<br><input type="text" name="description" required></label></p>
    <p><label>Дата:<br><input type="date" name="date" required></label></p>
    <button type="submit">Сохранить</button>
    <a href="/">Отмена</a>
</form>

{{template "footer" .}}

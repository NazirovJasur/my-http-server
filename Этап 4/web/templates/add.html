{{define "add"}}
<h2>Добавить трату</h2>
<form method="POST" action="/add">
    <p><label>Сумма:<br><input type="number" step="0.01" min="0.01" name="amount" required></label></p>
    <p><label>Описание:<br><input type="text" name="description" required></label></p>
    <p><label>Дата:<br><input type="date" name="date" required></label></p>
    <p><label>Категория:<br>
        <select name="category_id" required>
            <option value="">-- Выберите --</option>
            {{range .Categories}}
                <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
        </select>
    </label></p>
    <button type="submit">Сохранить</button>
    <a href="/">Отмена</a>
</form>
{{end}}

{{template "header" .}}

<h2>Список трат</h2>

{{if .}}
<table>
    <thead>
        <tr><th>ID</th><th>Сумма</th><th>Описание</th><th>Дата</th></tr>
    </thead>
    <tbody>
    {{range .}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Amount}}</td>
            <td>{{.Description}}</td>
            <td>{{.Date.Format "02.01.2006"}}</td>
        </tr>
    {{end}}
    </tbody>
</table>
{{else}}
<p>Пока нет трат. <a href="/add">Добавить первую</a></p>
{{end}}

{{template "footer" .}}
